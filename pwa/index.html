<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kymacache">
  <title>Kymacache</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <style>
    input::placeholder, textarea::placeholder {
      color: var(--muted);
      opacity: 0.8;
    }
  </style>
</head>
<body>

<div id="app" class="sidebar-layout">
  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-mark">K</span>
        <span class="logo-name">ymacache</span>
      </div>
    </div>

    <button class="compose-btn" id="compose-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      <span>Capture</span>
    </button>

    <nav class="sidebar-nav">
      <div class="nav-section">
        <button class="nav-item active" data-filter="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>All Entries</span>
        </button>
        <button class="nav-item" data-filter="starred">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span>Starred</span>
        </button>
        <button class="nav-item" id="trash-nav-item" data-filter="trashed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          <span>Trash</span>
        </button>
      </div>

      <div class="nav-section">
        <h3>Categories</h3>
        <button class="nav-item" data-type="image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <span>Images</span>
        </button>
        <button class="nav-item" data-type="url">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
          <span>Links</span>
        </button>
        <button class="nav-item" data-type="file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>Documents</span>
        </button>
      </div>

      <div class="nav-section" id="collections-section">
        <h3>Collections</h3>
        <div id="collections-list"></div>
        <button class="nav-item add-btn" id="new-collection-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>New Collection</span>
        </button>
      </div>

      <div class="nav-section" id="labels-section">
        <h3>Labels</h3>
        <div id="label-nav-list"></div>
      </div>

      <div class="nav-section">
        <h3>Family</h3>
        <button class="nav-item" id="family-admin-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><circle cx="19" cy="11" r="4"/></svg>
          <span>Manage Family</span>
        </button>
      </div>
    </nav>
  </aside>

  <!-- ── Main Content ── -->
  <main class="main-content">
    <header class="main-header">
      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="search" id="search-input" placeholder="Search entries, labels, people…" autocomplete="off">
        <div id="search-results" class="search-results hidden"></div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="bulk-actions-btn" title="Bulk Actions" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4h20v2H2zM2 11h20v2H2zM2 18h20v2H2z"/></svg>
        </button>
        <button class="icon-btn" id="view-toggle" title="Switch View">
        </button>
        <div class="user-profile" id="user-profile">
          <div class="avatar" id="user-avatar">U</div>
        </div>
      </div>
    </header>

    <div class="feed-container" id="feed-view">
      <div class="feed-header">
        <h2 id="feed-title">All Entries</h2>
        <div id="bulk-toolbar" class="bulk-toolbar hidden">
          <span id="selected-count">0 selected</span>
          <button class="bulk-btn danger" id="bulk-delete">Delete</button>
          <button class="bulk-btn" id="bulk-cancel">Cancel</button>
        </div>
      </div>

      <div id="entries-list" class="entries-list list-view">
        <div class="loading-state">Loading…</div>
      </div>
      <button class="load-more hidden" id="load-more">Load more</button>
    </div>

    <!-- Family Admin View -->
    <div class="feed-container hidden" id="family-admin-view">
      <div class="feed-header">
        <h2>Family Management</h2>
      </div>
      <div class="admin-section">
        <h3>Members</h3>
        <div class="member-list" id="member-list"></div>
        <button class="primary-btn" id="invite-member-btn" style="margin-top: 16px;">Invite Member</button>
      </div>
    </div>
  </main>

  <!-- Capture Panel -->
  <div id="capture-overlay" class="capture-overlay hidden">
    <section class="capture-panel">
      <div class="capture-header">
        <h3>New Capture</h3>
        <button class="close-btn" id="capture-close">&times;</button>
      </div>
      <div class="capture-tabs">
        <button class="tab active" data-tab="text">Text</button>
        <button class="tab" data-tab="url">URL</button>
        <button class="tab" data-tab="file">File</button>
      </div>
      <div class="tab-content active" data-content="text">
        <textarea id="text-input" placeholder="Capture a thought..." rows="6"></textarea>
      </div>
      <div class="tab-content" data-content="url">
        <input type="url" id="url-input" placeholder="https://...">
        <textarea id="url-note" placeholder="Optional note..." rows="3"></textarea>
      </div>
      <div class="tab-content" data-content="file">
        <label class="file-drop" id="file-drop">
          <input type="file" id="file-input" multiple hidden>
          <span>Drop files here</span>
        </label>
      </div>
      <div class="capture-footer">
        <span class="status-msg" id="capture-status"></span>
        <button class="capture-btn" id="capture-btn">Save</button>
      </div>
    </section>
  </div>

  <!-- Auth Overlay -->
  <div id="auth-overlay" class="auth-overlay hidden">
    <div class="auth-card">
      <h2 id="auth-title">Welcome back</h2>
      <form id="auth-form">
        <input type="email" id="auth-email" placeholder="Email" required autocomplete="email">
        <input type="password" id="auth-password" placeholder="Password" required autocomplete="current-password">
        <button type="submit" class="primary-btn" id="auth-submit">Sign In</button>
      </form>
      <div class="auth-sep"><span>OR</span></div>
      <button class="secondary-btn" id="google-auth-btn">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        <span>Continue with Google</span>
      </button>
      <p class="auth-toggle">Don't have an account? <a href="#" id="auth-toggle-link">Sign Up</a></p>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <h3>Edit Entry</h3>
      <textarea id="edit-text" rows="5"></textarea>
      <div class="modal-options">
        <label><input type="checkbox" id="edit-pinned"> Pin to top</label>
        <label><input type="checkbox" id="edit-public"> Public sharing</label>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="$('edit-modal').classList.add('hidden')">Cancel</button>
        <button class="btn primary" id="save-edit-btn">Save</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast-container"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app-v2.js" type="module"></script>
</body>
</html>
